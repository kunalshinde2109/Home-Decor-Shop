
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Home Decor</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f1eb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #8b6b55;
            font-size: 30px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #8b6b55;
            box-shadow: 0 0 5px rgba(139, 107, 85, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #8b6b55;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #70533f;
        }

        .messages {
            margin-bottom: 20px;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            background: #fbe9e7;
            color: #b03a2e;
            margin-bottom: 10px;
            font-size: 14px;
            text-align: center;
        }

        .links {
            text-align: center;
            margin-top: 22px;
        }

        .links p {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .links a {
            color: #8b6b55;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #8b6b55;
        }

        @media (max-width: 480px) {

            .login-container {
                padding: 28px 22px;
            }

            .logo h1 {
                font-size: 25px;
            }

        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>HOME DECOR</h1>
            <p>Make your home beautiful</p>
        </div>

        <h2>Welcome Back!</h2>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">

            {% csrf_token %}

            <input type="hidden" name="next" value="{{ request.GET.next }}">

            <div class="form-group">

                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="links">

            <p>
                Don't have an account?
                <a href="{% url 'signup' %}">Create Account</a>
            </p>

        </div>

        <a href="{% url 'home' %}" class="back-home">
            ← Back to Home
        </a>

    </div>

</body>
</html>
